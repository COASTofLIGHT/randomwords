<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Numbers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --mist: #EDF3F2;
    --ink: #10303A;
    --ink-soft: #456670;
    --line: #5F808A;
    --sea: #17677A;
    --sea-deep: #124F5E;
    --focus: #0B62A4;
    --font: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    --tile-c: #F2D9A6;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--mist);
    color: var(--ink);
    font-family: var(--font);
    -webkit-text-size-adjust: 100%;
  }

  .page {
    max-width: 1000px;
    margin: 0 auto;
    padding: clamp(1rem, 3vw, 2.25rem);
  }

  header h1 {
    margin: 0;
    font-size: clamp(1.7rem, 3.2vw, 2.5rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.05;
  }

  .back {
    display: inline-block;
    margin-bottom: 1rem;
    color: var(--ink-soft);
    font-size: 0.95rem;
    text-decoration: none;
  }
  .back:hover { text-decoration: underline; }
  .back:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  header p {
    margin: 0.35rem 0 0;
    color: var(--ink-soft);
    font-size: 1rem;
  }

  /* Controls */
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 1rem 1.75rem;
    margin: 1.5rem 0 1.25rem;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .field label {
    font-weight: 600;
    font-size: 0.95rem;
  }

  .field input {
    width: 6.5rem;
    height: 2.75rem;
    padding: 0 0.9rem;
    border: 2px solid var(--line);
    border-radius: 0.6rem;
    background: #fff;
    color: var(--ink);
    font: inherit;
    font-size: 1.1rem;
    font-weight: 700;
  }
  .field input:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  .buttons {
    display: flex;
    gap: 0.6rem;
  }

  .primary, .secondary {
    height: 2.75rem;
    padding: 0 1.6rem;
    border: 0;
    border-radius: 0.6rem;
    font: inherit;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
  }

  .primary { background: var(--sea); color: #fff; }
  .primary:hover { background: var(--sea-deep); }
  .primary:disabled { background: var(--line); cursor: not-allowed; }

  .secondary {
    background: transparent;
    color: var(--ink);
    border: 2px solid var(--line);
  }
  .secondary:hover { border-color: var(--ink); }

  .primary:active:not(:disabled), .secondary:active { transform: translateY(1px); }
  .primary:focus-visible, .secondary:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  .error {
    flex-basis: 100%;
    color: #8A2E1E;
    font-size: 0.95rem;
    font-weight: 600;
    min-height: 1.2em;
  }

  /* Tile */
  .tile {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: clamp(14rem, 46vh, 26rem);
    padding: clamp(1rem, 3vw, 2rem);
    border: 0;
    border-radius: 0.9rem;
    overflow: hidden;
    background: var(--tile-c);
    color: var(--ink);
    font: inherit;
    cursor: pointer;
  }
  .tile:hover { filter: brightness(0.96); }
  .tile:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
  .tile:disabled { cursor: default; }

  .tag {
    position: absolute;
    top: 1.1rem;
    left: 1.3rem;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0.5;
  }

  .number {
    display: block;
    font-size: clamp(4rem, 14vw, 10rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .done {
    display: block;
    max-width: 20rem;
    font-size: clamp(1.4rem, 3vw, 2rem);
    font-weight: 700;
    line-height: 1.25;
    text-align: center;
  }

  .number[hidden], .done[hidden] { display: none; }

  @keyframes settle {
    from { opacity: 0; transform: translateY(0.4rem); }
    to   { opacity: 1; transform: none; }
  }
  .fresh { animation: settle 0.22s ease-out; }

  .status {
    margin: 1rem 0 0;
    color: var(--ink-soft);
    font-size: 0.95rem;
  }

  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    .fresh { animation: none; }
  }
</style>
</head>
<body>
<main class="page">
  <a class="back" href="https://coastoflight.github.io/randomwords/">&larr; So random</a>

  <header>
    <h1>Numbers</h1>
    <p>Set a range, then call numbers one at a time — no repeats until every number's been called.</p>
  </header>

  <div class="controls">
    <div class="field">
      <label for="from">From</label>
      <input type="number" id="from" value="1" inputmode="numeric">
    </div>
    <div class="field">
      <label for="to">To</label>
      <input type="number" id="to" value="50" inputmode="numeric">
    </div>
    <div class="buttons">
      <button type="button" class="primary" id="call-btn">Call number</button>
      <button type="button" class="secondary" id="reset-btn">Reset</button>
    </div>
    <p class="error" id="error"></p>
  </div>

  <button type="button" class="tile" id="tile" aria-label="Click to call a number">
    <span class="tag" aria-hidden="true">Number</span>
    <span class="number" id="number"></span>
    <span class="done" id="done" hidden></span>
  </button>

  <p class="status" id="status-line"></p>
  <p class="sr" role="status" id="status"></p>
</main>

<script>
  const fromInput = document.getElementById("from");
  const toInput = document.getElementById("to");
  const callBtn = document.getElementById("call-btn");
  const resetBtn = document.getElementById("reset-btn");
  const errorEl = document.getElementById("error");
  const tile = document.getElementById("tile");
  const numberEl = document.getElementById("number");
  const doneEl = document.getElementById("done");
  const statusLine = document.getElementById("status-line");
  const statusEl = document.getElementById("status");

  let deck = [];
  let total = 0;
  let calledCount = 0;
  let finished = false;
  let range = null; // {start, end} currently loaded into the deck

  function shuffle(list) {
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
    return list;
  }

  function readRange() {
    const start = parseInt(fromInput.value, 10);
    const end = parseInt(toInput.value, 10);
    if (!Number.isFinite(start) || !Number.isFinite(end)) {
      return { error: "Enter a whole number in both fields." };
    }
    if (start > end) {
      return { error: "\u201cFrom\u201d must be less than or equal to \u201cTo\u201d." };
    }
    if (end - start + 1 > 100000) {
      return { error: "That range is too large \u2014 try something smaller." };
    }
    return { start, end };
  }

  function startRound() {
    const result = readRange();
    if (result.error) {
      errorEl.textContent = result.error;
      callBtn.disabled = true;
      tile.disabled = true;
      numberEl.hidden = false;
      doneEl.hidden = true;
      numberEl.textContent = "?";
      statusLine.textContent = "";
      range = null;
      return false;
    }
    errorEl.textContent = "";
    range = { start: result.start, end: result.end };
    total = range.end - range.start + 1;
    deck = shuffle(Array.from({ length: total }, (_, i) => range.start + i));
    calledCount = 0;
    finished = false;
    callBtn.disabled = false;
    tile.disabled = false;
    numberEl.hidden = false;
    doneEl.hidden = true;
    numberEl.textContent = "?";
    updateStatus();
    return true;
  }

  function updateStatus() {
    if (!range) return;
    statusLine.textContent = finished
      ? "All " + total + " numbers called."
      : calledCount + " of " + total + " called.";
    statusEl.textContent = statusLine.textContent;
  }

  function callNumber() {
    // If the range fields changed since the last round, start fresh instead of drawing.
    const result = readRange();
    if (result.error) {
      errorEl.textContent = result.error;
      return;
    }
    if (!range || result.start !== range.start || result.end !== range.end) {
      if (!startRound()) return;
    }
    if (finished) return;

    const value = deck.pop();
    calledCount++;
    numberEl.textContent = value;
    numberEl.classList.remove("fresh");
    void numberEl.offsetWidth;
    numberEl.classList.add("fresh");

    if (deck.length === 0) {
      finished = true;
      callBtn.disabled = true;
      numberEl.hidden = true;
      doneEl.hidden = false;
      doneEl.textContent = "All numbers called \u2014 press Reset to start a new round.";
      doneEl.classList.remove("fresh");
      void doneEl.offsetWidth;
      doneEl.classList.add("fresh");
    }
    updateStatus();
  }

  function reset() {
    startRound();
  }

  callBtn.addEventListener("click", callNumber);
  tile.addEventListener("click", callNumber);
  resetBtn.addEventListener("click", reset);

  [fromInput, toInput].forEach((input) => {
    input.addEventListener("change", () => { startRound(); });
  });

  document.addEventListener("keydown", (event) => {
    if (event.ctrlKey || event.metaKey || event.altKey) return;
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === "INPUT") return;
    if (event.code === "Space" || event.code === "Enter") { event.preventDefault(); callNumber(); }
    else if (event.key === "r" || event.key === "R") reset();
  });

  startRound();
</script>
</body>
</html>
